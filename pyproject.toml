[project]
name = "route-optimizer"
version = "0.1.0"
description = "A graph-based route optimisation and pathfinding project."
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35",
    "networkx>=3.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]